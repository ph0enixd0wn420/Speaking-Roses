name: Shopify Theme Check

on:
  push:
    branches:
      - shopify-os2-compat
  pull_request:
    branches:
      - main

permissions:
  contents: write
  checks: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Migrate legacy Liquid syntax and locale structures
        if: github.event_name == 'push'
        shell: bash
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          import json
          import re

          root = Path('.')

          # 1) Modernize the invalid VASTA pattern:
          #    render 'snippet' with key: value
          # to Shopify's supported named-argument syntax:
          #    render 'snippet', key: value
          render_named_args = re.compile(
              r"(\{%-?\s*render\s+(['\"][^'\"]+['\"]))\s+with(?=\s+[A-Za-z_][A-Za-z0-9_-]*\s*:)"
          )

          changed_liquid = 0
          replacements = 0
          for path in root.rglob('*.liquid'):
              text = path.read_text(encoding='utf-8')
              updated, count = render_named_args.subn(r"\1,", text)

              # One malformed assignment in the legacy cross-sell section.
              if path.as_posix() == 'sections/cross-sell.liquid':
                  updated = updated.replace('{% assign = i = 0 %}', '{% assign i = 0 %}')

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed_liquid += 1
                  replacements += count

          # 2) Normalize locale structures to the default locale while preserving
          # existing translated scalar values. When an old locale uses a scalar
          # such as "TODO" where the default now requires a nested object, fall
          # back to the default English subtree so Shopify can parse the locale.
          def read_locale(path):
              text = path.read_text(encoding='utf-8')
              start = text.find('{')
              if start < 0:
                  raise ValueError(f'No JSON object found in {path}')
              return text[:start], json.loads(text[start:])

          def normalize(default_value, local_value):
              if isinstance(default_value, dict):
                  if not isinstance(local_value, dict):
                      return deepcopy(default_value)
                  result = dict(local_value)
                  for key, value in default_value.items():
                      if key in local_value:
                          result[key] = normalize(value, local_value[key])
                      else:
                          result[key] = deepcopy(value)
                  return result

              if isinstance(default_value, list):
                  return local_value if isinstance(local_value, list) else deepcopy(default_value)

              # A scalar is structurally compatible only with another scalar.
              if isinstance(local_value, (dict, list)) or local_value is None:
                  return deepcopy(default_value)
              return local_value

          default_path = root / 'locales' / 'en.default.json'
          _, default_locale = read_locale(default_path)
          changed_locales = 0

          for path in sorted((root / 'locales').glob('*.json')):
              if path.name == 'en.default.json' or path.name.endswith('.schema.json'):
                  continue
              prefix, locale = read_locale(path)
              normalized = normalize(default_locale, locale)
              if normalized != locale:
                  path.write_text(
                      prefix + json.dumps(normalized, ensure_ascii=False, indent=2) + '\n',
                      encoding='utf-8'
                  )
                  changed_locales += 1

          print(f'Updated {changed_liquid} Liquid files; converted {replacements} legacy render tags.')
          print(f'Normalized {changed_locales} locale files.')
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.liquid' 'locales/*.json'
            git commit -m "fix: modernize legacy Liquid renders and locales [skip ci]"
            git push
          fi

      - name: Run Shopify Theme Check annotations
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          token: ${{ github.token }}
          base: main

      - name: Export full Theme Check JSON
        if: always()
        run: |
          npx shopify theme check --output json > theme-check.json || true
          cat theme-check.json

      - name: Upload Theme Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check-report
          path: theme-check.json
          retention-days: 7
