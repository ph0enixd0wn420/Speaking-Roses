name: Shopify Theme Check

on:
  push:
    branches:
      - shopify-os2-compat
  pull_request:
    branches:
      - main

permissions:
  contents: write
  checks: write

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout theme
        uses: actions/checkout@v4

      - name: Apply final theme repairs
        if: github.event_name == 'push'
        run: python .github/scripts/fix-final-theme-errors.py

      - name: Commit repair changes
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/VastaShop.js.liquid snippets/footer-layout04.liquid
            git commit -m "fix: resolve final Shopify parser errors [skip ci]"
            git push
          fi

      - name: Run Shopify Theme Check annotations
        uses: shopify/theme-check-action@v2
        with:
          theme_root: '.'
          token: ${{ github.token }}
          base: main

      - name: Export full Theme Check JSON
        if: always()
        run: |
          npx shopify theme check --output json > theme-check.json || true
          cat theme-check.json

      - name: Upload Theme Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-check-report
          path: theme-check.json
          retention-days: 7
